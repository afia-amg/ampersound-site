[build]
  command = "node --test tests/*.cjs && node -e \"require('fs').writeFileSync('portal-regression-status.json', JSON.stringify({passed:true,commit:process.env.COMMIT_REF||null,builtAt:new Date().toISOString()}))\""

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/portal-regression-status.json"
  [headers.values]
    Cache-Control = "no-store"

# Retired legacy pages. Angelica & Nathan are booked and their event has passed,
# so the old quote and signing pages send them to their portal instead of
# offering a fresh signature. The files stay in the repo for the legacy tests.
[[redirects]]
  from = "/partner-docs/angelica-nathan/sign"
  to = "/partner-docs/angelica-nathan/"
  status = 301
  force = true

[[redirects]]
  from = "/partner-docs/angelica-nathan/sign.html"
  to = "/partner-docs/angelica-nathan/"
  status = 301
  force = true

[[redirects]]
  from = "/partner-docs/angelica-nathan/quote"
  to = "/partner-docs/angelica-nathan/"
  status = 301
  force = true

[[redirects]]
  from = "/partner-docs/angelica-nathan/quote.html"
  to = "/partner-docs/angelica-nathan/"
  status = 301
  force = true

# Cue Sheet: private vendor links and the coordinator console.
# Real files (like /cue/_assets/*) are served first; these only catch the pretty URLs.
[[redirects]]
  from = "/cue/:event/control"
  to = "/cue/control.html"
  status = 200

[[redirects]]
  from = "/cue/:event/:code"
  to = "/cue/vendor.html"
  status = 200

[[headers]]
  for = "/cue/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"
