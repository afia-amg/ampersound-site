# Cue Sheet: private vendor links and the coordinator console.
# Real files (like /cue/_assets/*) are served first; these only catch the pretty URLs.
[[redirects]]
  from = "/cue/:event/control"
  to = "/cue/control.html"
  status = 200

# A room's stage-manager console for multi-room shows.
[[redirects]]
  from = "/cue/:event/room/:code"
  to = "/cue/control.html"
  status = 200

[[redirects]]
  from = "/cue/:event/:code"
  to = "/cue/vendor.html"
  status = 200

[[headers]]
  for = "/cue/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/cue/"

[[headers]]
  for = "/cue/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"

# Pitch Room: prospect decks behind the email lookup. Kept out of search and referrer logs.
[[headers]]
  for = "/pitch-room/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"
