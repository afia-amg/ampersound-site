<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f1114">
<title>Your day · Ampersound Cue Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cue/_assets/cue.css">
</head>
<body>
<main class="wrap" id="app"><div class="center"><p>Loading your day…</p></div></main>
<div class="scrim"></div>
<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" inert>
  <h3 id="sheet-title">Alert the team</h3>
  <button class="x" type="button" aria-label="Close">×</button>
  <textarea aria-label="What's going on" placeholder="e.g. Stuck in traffic, 10 min out" maxlength="500"></textarea>
  <div class="seg" role="group" aria-label="How urgent">
    <button type="button" data-level="note" aria-pressed="true">Heads up</button>
    <button type="button" data-level="urgent" class="urgent" aria-pressed="false">Urgent</button>
  </div>
  <button class="btn" id="send" type="button" disabled>Send to coordinator</button>
</section>
<script src="/cue/_assets/cue-core.js"></script>
<script src="/cue/_assets/vendor.js"></script>
</body>
</html>
