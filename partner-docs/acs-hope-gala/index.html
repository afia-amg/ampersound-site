<script src="/partner-docs/_assets/portal.js"></script>
<script>
/* ACS pays the full fee by ACH against one invoice through its vendor system
 * (Coupa), so the payment step shows invoice instructions instead of a Stripe
 * button and the quote shows a single payment instead of a deposit split. Full bank
 * details are deliberately not published on this public page. */
(function () {
 var main = document.getElementById("main");
 if (!main || !window.MutationObserver) return;
 var STRIPE_WAIT = /^Waiting for Stripe/;
 var CARD = '<span class="label">Invoice \u00b7 paid in full</span>'
  + '<p class="big" style="font-family:var(--head);font-weight:800;font-size:2.7rem;color:var(--gold)">$1,650.00</p>'
  + '<p style="margin:0 0 1.35rem;font-size:0.87rem;color:var(--faint)">Full fee, one payment &middot; due on receipt, no later than Feb 6, 2027</p>'
  + '<div class="row"><div class="rl"><p>Payment method</p><small>Paid through your vendor system (Coupa)</small></div><p class="rv">ACH / direct deposit</p></div>'
  + '<div class="row"><div class="rl"><p>Payee</p></div><p class="rv">Ampersound Media Group LLC</p></div>'
  + '<div class="row"><div class="rl"><p>Bank</p></div><p class="rv">Mercury</p></div>'
  + '<div class="row"><div class="rl"><p>Remittance details</p><small>Routing and account numbers</small></div><p class="rv">On your invoice and in Coupa</p></div>'
  + '<div class="actions" style="margin-top:1.2rem"><a class="btn" href="mailto:afia@ampersoundmediagroup.com?subject=Hope%20Gala%202027%20invoice">Request the invoice</a></div>'
  + '<p style="margin:1.1rem 0 0;font-size:0.8rem;color:var(--faint);line-height:1.65">For your security, we never publish bank details online and never change them by email alone. If anyone asks you to update our banking information, confirm with Afia directly before sending payment. Check is also accepted.</p>';
 function patchBanners() {
  Array.prototype.forEach.call(main.querySelectorAll(".banner[role=status]"), function (b) {
   var t = b.firstChild;
   if (t && t.nodeType === 3 && STRIPE_WAIT.test(t.nodeValue)) t.nodeValue = "Your payment is made by ACH against our invoice. Once it arrives, we confirm your booking and open the planning tabs. ";
  });
 }
 function patchDeposit() {
  var h = main.querySelector("h2.sec");
  if (!h || h.textContent !== "The deposit" || main.querySelector("[data-ach]")) return;
  var intro = h.nextElementSibling;
  if (intro && intro.classList.contains("intro")) intro.textContent = "Your agreement is signed and safe with us. We invoice the full amount for payment by ACH, and your date is confirmed once it arrives.";
  h.innerHTML = "The <em>payment</em>";
  var card = main.querySelector(".card");
  if (!card) return;
  card.setAttribute("data-ach", "1");
  card.innerHTML = CARD;
 }
 function patchTotal() {
  var s = main.querySelector(".total .split");
  if (!s || s.hasAttribute("data-full")) return;
  s.setAttribute("data-full", "1");
  s.innerHTML = '<div><p class="k">Paid in full</p><p class="v gold">$1,650.00</p><p class="n">One ACH invoice, due on receipt and no later than Feb 6, 2027</p></div>';
 }
 function patchSteps() {
  Array.prototype.forEach.call(main.querySelectorAll(".steps button"), function (b) {
   var t = b.lastChild;
   if (t && t.nodeType === 3 && t.nodeValue === "Deposit") t.nodeValue = "Payment";
  });
 }
 function patch() { patchBanners(); patchSteps(); patchTotal(); patchDeposit(); }
 new MutationObserver(patch).observe(main, { childList: true });
 patch();
})();
</script>
