<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="robots" content="noindex, nofollow"><title>Webhook Diagnostics</title>
<style>body{font-family:monospace;background:#0f1114;color:#f0ebe4;padding:24px}button{font-size:16px;padding:10px 16px;margin:6px}pre{white-space:pre-wrap;background:#181c21;padding:12px}</style></head>
<body><h1>Internal webhook diagnostics</h1>
<button id="viewed">Send viewed</button><button id="signed">Send signed (test PNG)</button><button id="nomatch">Send signed, unknown email</button>
<pre id="out">ready</pre>
<script>
var PNG='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
function send(body){var o=document.getElementById('out');o.textContent='sending '+body.action+'...';
fetch('/.netlify/functions/agreement-webhook',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
.then(function(r){return r.text().then(function(t){o.textContent='HTTP '+r.status+'\n'+t;});})
.catch(function(e){o.textContent='FETCH ERROR '+e;});}
var base={client:'Signature Test',contact:'Portal Test',email:'signature-test@ampersoundmediagroup.com',event_date:'2027-01-01',total_fee:1,deposit:0.5,package:'Test'};
document.getElementById('viewed').onclick=function(){send(Object.assign({},base,{action:'viewed'}));};
document.getElementById('signed').onclick=function(){send(Object.assign({},base,{action:'signed',signature:PNG,signedAt:new Date().toISOString(),signerName:'Portal Test'}));};
document.getElementById('nomatch').onclick=function(){send(Object.assign({},base,{action:'signed',email:'nobody-'+Date.now()+'@example.com'}));};
</script></body></html>
