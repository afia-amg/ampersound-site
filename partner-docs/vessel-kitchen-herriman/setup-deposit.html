<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="robots" content="noindex, nofollow"><title>Deposit setup</title></head>
<body>
<p>Internal setup: creates the $200 Vessel Kitchen deposit link once and saves it to the ClickUp agreement. Removed after use.</p>
<button type="button" id="go">Create deposit link</button>
<pre id="out"></pre>
<script>
document.getElementById('go').addEventListener('click',function(){
 var b=this;b.disabled=true;document.getElementById('out').textContent='working';
 fetch('/.netlify/functions/create-payment-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientName:'Vessel Kitchen',eventName:'VIP Grand Opening - Herriman',eventDate:'2026-12-09',eventType:'Other',venue:'Vessel Kitchen Herriman',services:'DJ / Sound Direction',amount:200,balance:200,agreementTaskId:'86bd6ht2z',leadTaskId:'86bd4m695',email:'awilkin@vesselkitchen.com'})})
 .then(function(r){return r.text().then(function(t){return r.status+' '+t;});})
 .then(function(t){document.getElementById('out').textContent=t;})
 .catch(function(e){document.getElementById('out').textContent='ERR '+e;});
});
</script>
</body></html>
